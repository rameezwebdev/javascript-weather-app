<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <!-- Yeh working CDN link hai -->
   <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Modern Weather App</title> 
    <link rel="stylesheet" href="style.css"> 
</head> 
<body> 
    <section class="container"> 
    <!-- header section -->
        <div class="weather_header"> 
            <form class="weather_search"> 
                <!-- fa-thin ko badal kar fa-solid kiya hai -->
                <i class="fa-solid fa-magnifying-glass"></i> 
                <input type="text" class="city_name" placeholder="search your city"/> 
            </form> 
        </div> 

    <!-- weather body content -->
        <div class="weather_body">
            <h1 class="weather_city"></h1>
            <p class="weather_date_time"></p>
            <div class="weather_data">
                <p class="weather_forecast"></p>
                <div class="weather_icon"></div>
            </div>
            <p class="weather_tem"></p>
            <div class="weather_minmax">
                <p class="weather_min"></p>
                <p class="weather_max"></p>
            </div>

        </div>

    <!--weather extra data-->
        <section class="weather_info">

    <div class="weather_card">
        <i class="fa-solid fa-temperature-half"></i>
        <h4>Feels Like</h4>
        <p class="weather_feelslike">15;</p>
    </div>

    <div class="weather_card">
        <i class="fa-solid fa-droplet"></i>
        <h4>Humidity</h4>
        <p class="weather_humidity"></p>
    </div>

    <div class="weather_card">
        <i class="fa-solid fa-wind"></i>
        <h4>Wind</h4>
        <p class="weather_wind">10 km/h</p>
    </div>

    <div class="weather_card">
        <i class="fa-solid fa-gauge-high"></i>
        <h4>Pressure</h4>
        <p class="weather_pressure">1013 </p>
    </div>

</section>

    </section> 

<script src="script.js"></script>    
</body> 
</html>
